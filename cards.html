<html> 
    <head>
        <Title>Cards in bootstrap</Title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>   
    </head>
    <body> 
        <h1 style="text-align: center; color: aqua;">Welcome to Codingal</h1>
        <div class="container">
            <div class="card">
                <img class="card-img-top" src="Flower.png" alt="Flower"> 
                <div class="card-body">
                    <h5 class="card-title">Flower</h5>
                    <p class="card-text">Flowers, also known as blossoms and blooms,
                        are the reproductive structures of flowering plants.</p>
                        <a href="https://www.britannica.com/science/flower" class="btn btn-primary">See details</a>
                </div>
            </div>
        </div>
    </body>
</html>
